name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: PowerShell syntax checks
        shell: pwsh
        run: ./check-syntax.ps1

      - name: Legacy unit tests (BDD)
        shell: pwsh
        run: ./tests/run-tests.ps1

  node-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Domain tests
        run: npm test

      - name: Generated schemas and goldens are in sync
        run: npm run verify-generated
